# Integration-test databases. `docker compose up -d` then point
# RECALL_TEST_PG_URL at postgres://postgres:postgres@127.0.0.1:55432/recall_test
# and RECALL_TEST_REDIS_URL=redis://127.0.0.1:56379
# and RECALL_TEST_MYSQL_URL=mysql://root:mysql@127.0.0.1:53306/recall_test
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recall_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recall_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    # Bun refuses caching_sha2's RSA key exchange over plain TCP. Root is
    # created on the first boot only, so changing this needs `rm -v`.
    command: ["--mysql-native-password=ON", "--authentication-policy=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: recall_test
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pmysql"]
      interval: 2s
      timeout: 3s
      retries: 60

  redis:
    image: redis:7.4
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
